
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donor Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Blood Donor Finder</h1>
        <p>Find blood donors in your city</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#register">Register Donor</a>
        <a href="#search">Find Donor</a>
    </nav>

    <section id="home">
        <h2>Welcome</h2>
        <p>
            This website helps people find blood donors
            based on blood group and city.
        </p>
    </section>

    <section id="register">
        <h2>Register as a Donor</h2>

        <form id="donorForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="blood">Blood Group</label>
            <select id="blood" required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>O+</option>
                <option>O-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>

            <label for="city">City</label>
            <input type="text" id="city" required>

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                pattern="[0-9]{10}"
                maxlength="10"
                required
                placeholder="10-digit phone number"
            >

            <button type="submit">Register Donor</button>
        </form>

        <p id="message"></p>
    </section>

    <section id="search">
        <h2>Find Blood Donors</h2>

        <label for="searchBlood">Blood Group</label>
        <select id="searchBlood">
            <option value="">All Blood Groups</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <label for="searchCity">City</label>
        <input type="text" id="searchCity"
               placeholder="Enter city name">

        <button type="button" id="searchButton">
            Search Donors
        </button>

        <div id="donorList"></div>
    </section>

    <footer>
        <p>Cloud-Based Blood Donor Finder</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
